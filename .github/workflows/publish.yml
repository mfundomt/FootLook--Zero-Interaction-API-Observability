name: Publish FootLook Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./FootLook/FootLook.sln

      - name: Build
        run: dotnet build ./FootLook/FootLook.sln --configuration Release --no-restore

      - name: Pack FootLook.Core
        run: dotnet pack ./FootLook/FootLook.Core/FootLook.Core.csproj --configuration Release --no-build --output ./artifacts

      - name: Pack FootLook.Data
        run: dotnet pack ./FootLook/FootLook.Data/FootLook.Data.csproj --configuration Release --no-build --output ./artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: MfundoMt

      - name: Publish packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
