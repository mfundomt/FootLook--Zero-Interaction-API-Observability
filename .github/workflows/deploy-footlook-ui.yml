name: Deploy FootLook UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'FootLook/FootLook.Demo/**'
      - '.github/workflows/deploy-footlook-ui.yml'

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  DEMO_PROJECT_PATH: 'FootLook/FootLook.Demo/FootLook.Demo.csproj'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.DEMO_PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.DEMO_PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.DEMO_PROJECT_PATH }} --configuration Release --no-build --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
